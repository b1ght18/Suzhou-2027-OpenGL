  <title id="title">Suzhou 2027 — two visions of one city</title>
  <desc id="desc">A midnight-blue masthead with gold lettering, a canal bridge and the Gate of Orient drawn as fine architectural lines.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2=".5"><stop stop-color="#081520"/><stop offset="1" stop-color="#143541"/></linearGradient>
    <linearGradient id="water"><stop stop-color="#83d7cb" stop-opacity="0"/><stop offset=".55" stop-color="#83d7cb" stop-opacity=".45"/><stop offset="1" stop-color="#83d7cb" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#d7b477" stop-opacity=".14"/><stop offset="1" stop-color="#d7b477" stop-opacity="0"/></radialGradient>
  </defs>
