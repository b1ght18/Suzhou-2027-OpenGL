    <text x="84" y="211" font-family="Georgia, 'Times New Roman', serif" font-size="100" fill="#f2ecdf">Suzhou <tspan fill="#dfc18e">2027</tspan></text>
    <text x="90" y="264" font-size="23" fill="#a7c1c4">Water town quiet. City lights. A new beginning.</text>
